<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMwaves Wellness | PEMF Therapy</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F8F7;--ink:#0A2A33;--mut:#4B6A71;--card:#FFFFFF;--line:#CFE3E1;--aqua:#13B5A4;--deep:#06222B;--amber:#FFB23E;--orange:#F47A20;--blue:#2F7BFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071C23;--ink:#E6F4F2;--mut:#93B2B7;--card:#0D2B34;--line:#1B424C}}
:root[data-theme="dark"]{--bg:#071C23;--ink:#E6F4F2;--mut:#93B2B7;--card:#0D2B34;--line:#1B424C}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.08;letter-spacing:-.02em}
a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 22px}
nav{position:sticky;top:0;z-index:20;background:#fff;color:#0A2A33;border-bottom:3px solid var(--orange)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:block;line-height:0}.logo img{height:46px;width:auto;mix-blend-mode:multiply}
nav ul{list-style:none;padding:0;margin:0}
.menu{position:fixed;top:69px;right:0;bottom:0;width:min(380px,88vw);background:var(--deep);padding:14px 18px 40px;overflow:auto;transform:translateX(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility .35s;box-shadow:-20px 0 50px rgba(0,0,0,.3)}
.menu.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:69px 0 0;background:rgba(3,20,26,.5)}
.menu a{display:block;padding:9px 12px;text-decoration:none;font-size:16px;color:#E6F4F2;border-radius:8px}.menu a:hover{color:var(--orange);background:rgba(255,255,255,.05)}
.menu>li>a{font:700 20px 'Bricolage Grotesque';padding:13px 12px;border-bottom:1px solid #1B424C;border-radius:0}
.sub{padding-left:14px!important;margin:4px 0 10px!important}.sub .sub a{font-size:14.5px;color:#B7D3D6}
.navr{display:flex;gap:12px;align-items:center}
.burger{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:grid;place-content:center;gap:5px}
.burger i{display:block;width:22px;height:2.5px;background:var(--orange);border-radius:2px;transition:transform .3s,opacity .2s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(7.5px) rotate(45deg)}.burger[aria-expanded=true] i:nth-child(2){opacity:0}.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);text-decoration:none;font-size:14px;font-weight:600;transition:all .2s}.chip:hover{background:var(--orange);color:#1E0B00;border-color:var(--orange)}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;background:var(--orange);color:#1E0B00;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-size:16px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(244,122,32,.45)}.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.btn.ghost{background:transparent;color:#E6F4F2;border:1.5px solid #3b6d76}
.hero{position:relative;background:var(--deep);color:#E6F4F2;overflow:hidden;min-height:620px;display:flex;align-items:center}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;padding-top:70px;padding-bottom:90px}
.hero h1{font-size:clamp(40px,8vw,84px);max-width:11ch;font-weight:800}
.hero h1 span{display:block}.hero .free{color:var(--orange)}
.hero p{max-width:46ch;margin:22px 0 30px;color:#B7D3D6;font-size:19px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.rise:nth-child(2){animation-delay:.12s}.rise:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
section{padding:84px 0}h2{font-size:clamp(30px,5vw,48px);margin-bottom:14px}.lead{color:var(--mut);max-width:58ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin-top:-46px;position:relative;z-index:2}
.stat{background:var(--card);padding:26px 24px;border:1px solid var(--line)}
.stat b{font:800 44px 'Bricolage Grotesque';display:block;color:var(--aqua)}.stat:nth-child(even) b{color:var(--orange)}.stat span{color:var(--mut);font-size:15px}
.lab{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;margin-top:36px}
@media(max-width:820px){.lab{grid-template-columns:1fr}}
.cell{background:var(--deep);border-radius:28px;padding:20px;color:#E6F4F2}
.cell svg{width:100%;display:block}
.ion{fill:var(--aqua);animation:drift var(--s,3s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
.membrane{fill:none;stroke:var(--aqua);stroke-width:5;transition:stroke-dasharray .5s,stroke .5s}
.batt{height:18px;border-radius:9px;background:#14404A;overflow:hidden;margin:10px 0 4px}
.batt i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--orange));transition:width .5s}
input[type=range]{width:100%;accent-color:var(--aqua);margin:8px 0}
.readout{display:flex;justify-content:space-between;font-size:14px;color:#93B2B7}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 18px}
.tab{padding:11px 20px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 15px Figtree;cursor:pointer;transition:all .25s}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;animation:rise .5s both}
@media(max-width:640px){.panel{grid-template-columns:1fr}}
.panel svg{width:100%;max-width:200px}.panel h3{font-size:28px;margin-bottom:8px}
.band{background:var(--deep);color:#E6F4F2;padding:30px 0;overflow:hidden}
.marq{display:flex;gap:34px;width:max-content;animation:slide 40s linear infinite;font:700 24px 'Bricolage Grotesque';white-space:nowrap}
.marq span:nth-child(3n){color:var(--orange)}.marq:hover{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.arts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:30px}
.art{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;text-decoration:none;transition:transform .25s,border-color .25s}
.art:hover{transform:translateY(-5px);border-color:var(--orange)}.art small{color:var(--orange);font-weight:600}.art h3{font-size:20px;margin:8px 0}.art p{color:var(--mut);font-size:15px}
.cta{background:var(--deep);color:#E6F4F2;border-radius:30px;padding:54px 34px;text-align:center;position:relative;overflow:hidden}
.cta p{color:#B7D3D6;margin:0 auto 26px;max-width:50ch}
.cta::before,.cta::after{content:"";position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border-radius:50%;border:2px solid var(--orange);animation:ping 4s ease-out infinite;opacity:0}
.cta::after{animation-delay:2s}@keyframes ping{from{transform:scale(.6);opacity:.6}to{transform:scale(4);opacity:0}}
.cta>*{position:relative;z-index:1}
footer{padding:36px 0 50px;color:var(--mut);font-size:14px}footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
.dis{margin-top:14px;font-size:13px;max-width:80ch}
.show{position:relative;margin-top:30px;border-radius:26px;overflow:hidden;border:1px solid var(--line);clip-path:inset(0 100% 0 0);transition:clip-path 1.2s cubic-bezier(.7,0,.2,1)}
.show.on{clip-path:inset(0)}.show img{display:block;width:100%;height:auto}.show svg{position:absolute;inset:0;width:100%;height:100%}
.ring{fill:none;stroke:var(--orange);stroke-width:3;transform-box:fill-box;transform-origin:center;opacity:0}
.on .ring{animation:emit 3.6s ease-out infinite}@keyframes emit{from{transform:scale(1);opacity:.9}to{transform:scale(5);opacity:0}}
.flow{fill:none;stroke:#0E8F82;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 14;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-48}}
.pulse{fill:none;stroke:#E03B3B;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:soft 2.8s ease-in-out infinite}@keyframes soft{50%{transform:scale(1.07);opacity:.15}}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:center}
.gal{margin:0;position:relative}
.gframe{position:relative;aspect-ratio:800/433;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 60px rgba(0,0,0,.4);background:#0D2B34}
.gframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.gframe img.on{opacity:1}
.gdots{display:flex;justify-content:center;gap:10px;margin-top:14px}
.gdots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;transition:background .3s,transform .3s}
.gdots button.on{background:var(--orange);transform:scale(1.25)}
@media(max-width:900px){.herogrid{grid-template-columns:1fr;gap:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:reduce){.show{clip-path:none}.ring{opacity:.5}}
</style>

function Waves(){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current,x=c.getContext("2d");let t=0,raf,w,h;
    const rs=()=>{w=c.width=c.offsetWidth;h=c.height=c.offsetHeight};rs();addEventListener("resize",rs);
    const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
    const draw=()=>{
      x.clearRect(0,0,w,h);
      for(let i=0;i<9;i++){
        x.beginPath();
        for(let px=0;px<=w;px+=6){
          const y=h*.62+Math.sin(px/(110+i*18)+t*(1+i*.12)+i)*(26+i*8)+Math.sin(px/60-t)*6;
          px?x.lineTo(px,y):x.moveTo(px,y);
        }
        x.strokeStyle=i%4==3?"rgba(244,122,32,.55)":`rgba(19,181,164,${.12+i*.05})`;x.lineWidth=1.6;x.stroke();
      }
      t+=.012;if(!calm)raf=requestAnimationFrame(draw);
    };draw();
    return()=>{cancelAnimationFrame(raf);removeEventListener("resize",rs)};
  },[]);
  return <canvas ref={ref} aria-hidden="true"/>;
}

function Gallery(){
  const [i,setI]=useState(0),[hold,setHold]=useState(false),n=GALLERY.length;
  useEffect(()=>{if(hold)return;const t=setInterval(()=>setI(v=>(v+1)%n),3000);return()=>clearInterval(t)},[hold,i,n]);
  return <figure className="gal" aria-roledescription="carousel" aria-label="AMwaves PEMF therapy gallery" onMouseEnter={()=>setHold(true)} onMouseLeave={()=>setHold(false)}>
    <div className="gframe">{GALLERY.map(([src,alt],k)=><img key={k} className={k===i?"on":""} src={src} alt={alt} aria-hidden={k!==i} decoding="async"/>)}</div>
    <div className="gdots" role="group" aria-label="Choose picture">{GALLERY.map((_,k)=><button key={k} type="button" className={k===i?"on":""} aria-label={"Show picture "+(k+1)} aria-current={k===i} onClick={()=>setI(k)}/>)}</div>
  </figure>;
}

function Count({to,suffix=""}){
  const [n,setN]=useState(0),r=useRef();
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{
      if(!e.isIntersecting)return;o.disconnect();const s=performance.now();
      const f=now=>{const p=Math.min((now-s)/1600,1);setN(Math.round(to*(1-Math.pow(1-p,3))));p<1&&requestAnimationFrame(f)};requestAnimationFrame(f);
    });o.observe(r.current);return()=>o.disconnect();
  },[to]);
  return <b ref={r}>{n.toLocaleString("en-IN")}{suffix}</b>;
}

function CellLab(){
  const [v,setV]=useState(40);
  const ions=Array.from({length:16},(_,i)=>{const a=i/16*6.283;return{cx:200+Math.cos(a)*(40+(i%3)*22),cy:130+Math.sin(a)*(30+(i%3)*14),dx:Math.cos(a+1)*-18,dy:Math.sin(a+1)*-14,s:(4.2-v/30)+(i%4)*.3}});
  const hz=Math.round(2+v*.38);
  return(
    <div className="cell">
      <svg viewBox="0 0 400 260" role="img" aria-label="A cell receiving pulsed electromagnetic energy">
        {[0,1,2].map(i=><ellipse key={i} cx="200" cy="130" rx={90+i*28} ry={70+i*20} fill="none" stroke="#2F7BFF" strokeOpacity={.35-i*.09} strokeDasharray="3 8"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur={`${3.5-v/40}s`} repeatCount="indefinite"/></ellipse>)}
        <ellipse className="membrane" cx="200" cy="130" rx="86" ry="66" strokeDasharray={`${40+v*3} ${22-v/6}`} style={{stroke:v>70?"#F47A20":"#13B5A4"}}/>
        {ions.map((p,i)=><circle key={i} className="ion" cx={p.cx} cy={p.cy} r="4.5" style={{"--dx":p.dx+"px","--dy":p.dy+"px","--s":p.s+"s"}}/>)}
      </svg>
      <label htmlFor="int" style={{fontWeight:600}}>Field intensity</label>
      <input id="int" type="range" min="5" max="100" value={v} onChange={e=>setV(+e.target.value)}/>
      <div className="batt"><i style={{width:v+"%"}}/></div>
      <div className="readout"><span>Cell charge {v}%</span><span>{hz} Hz pulse</span></div>
    </div>
  );
}
